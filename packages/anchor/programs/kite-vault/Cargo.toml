[package]
name = "kite-vault"
version = "0.1.0"
description = "Experimental bounded wallet-to-wallet recurring settlement; no vault or basket mint"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kite_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
