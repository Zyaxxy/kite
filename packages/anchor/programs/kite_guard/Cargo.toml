[package]
name = "kite_guard"
version = "0.2.0"
description = "Kite Execution Guard: trustless recurring investment execution on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kite_guard"

[features]
anchor-debug = []
custom-heap = []
custom-panic = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["token"] }

[dev-dependencies]
anchor-lang-idl = { version = "0.1.4", features = ["build"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
